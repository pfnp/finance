<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>Финансы</title>

<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Финансы">

<style>
:root{
  --bg:#f4f5f7;
  --card:#fff;
  --text:#111;
  --muted:#777;
  --primary:#111;
  --green:#1fbf75;
  --red:#ff5b5b;
  --blue:#4c8dff;
  --border:rgba(0,0,0,.08);
  --shadow:0 10px 30px rgba(0,0,0,.08);
}

body.dark{
  --bg:#0f1115;
  --card:#191c22;
  --text:#fff;
  --muted:#9aa0aa;
  --primary:#fff;
  --border:rgba(255,255,255,.08);
  --shadow:0 10px 30px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  overflow:hidden;
  width:100%;
  height:100%;
  position:fixed;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
  transition:.25s;
}

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

.screen{
  flex:1;
  overflow-y:auto;
  padding:18px;
  padding-bottom:120px;
  opacity:0;
  transform:translateX(20px);
  transition:opacity .25s ease, transform .25s ease;
  display:none;
}

.screen.active{
  display:block;
  opacity:1;
  transform:translateX(0);
}

.header{
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  margin-bottom:18px;
}

.header h1{
  margin:0;
  font-size:24px;
  font-weight:800;
}

.left-actions{
  position:absolute;
  left:0;
}

.right-actions{
  position:absolute;
  right:0;
}

.icon-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:14px;
  background:var(--card);
  color:var(--text);
  font-size:18px;
  box-shadow:var(--shadow);
}

.card{
  background:var(--card);
  border-radius:20px;
  padding:18px;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
}

.balance-card{
  margin-bottom:16px;
}

.balance-value{
  font-size:34px;
  font-weight:800;
  margin-top:10px;
}

.balance-label{
  color:var(--muted);
  font-size:14px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:16px;
}

.stat{
  background:var(--card);
  border-radius:18px;
  padding:14px;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
}

.stat small{
  display:block;
  color:var(--muted);
  margin-bottom:8px;
}

.form{
  background:var(--card);
  border-radius:20px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
}

.segment{
  display:flex;
  background:rgba(127,127,127,.12);
  padding:4px;
  border-radius:16px;
  margin-bottom:12px;
}

.segment button{
  flex:1;
  border:none;
  background:transparent;
  color:var(--text);
  border-radius:12px;
  padding:10px;
  font-weight:700;
}

.segment button.active{
  background:var(--card);
  box-shadow:var(--shadow);
}

.input,select{
  width:100%;
  border:none;
  background:rgba(127,127,127,.1);
  color:var(--text);
  padding:14px;
  border-radius:14px;
  margin-bottom:10px;
  font-size:16px;
}

.add-btn{
  width:100%;
  border:none;
  border-radius:16px;
  padding:16px;
  font-size:24px;
  font-weight:800;
  background:var(--primary);
  color:var(--bg);
}

.day-group{
  margin-bottom:18px;
}

.day-title{
  margin-bottom:10px;
  font-weight:800;
  color:var(--muted);
}

.transaction{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--card);
  padding:14px;
  border-radius:18px;
  margin-bottom:10px;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
  animation:fadeIn .22s ease;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(10px) scale(.98);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.emoji{
  font-size:24px;
}

.info{
  flex:1;
}

.comment{
  font-weight:700;
}

.time{
  font-size:13px;
  color:var(--muted);
}

.amount{
  font-weight:800;
}

.amount.income{color:var(--green);}
.amount.expense{color:var(--red);}
.amount.asset{color:var(--blue);}

.delete-btn{
  border:none;
  background:transparent;
  font-size:18px;
}

.bottom-nav{
  position:fixed;
  left:18px;
  right:18px;
  bottom:calc(14px + env(safe-area-inset-bottom));
  background:var(--card);
  border-radius:24px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  padding:10px;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
}

.nav-btn{
  border:none;
  background:transparent;
  color:var(--muted);
  border-radius:18px;
  padding:10px;
  font-weight:700;
}

.nav-btn.active{
  background:rgba(127,127,127,.12);
  color:var(--text);
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:flex-end;
  z-index:100;
}

.modal.active{
  display:flex;
}

.modal-content{
  width:100%;
  background:var(--bg);
  border-radius:28px 28px 0 0;
  padding:20px;
  max-height:88vh;
  overflow-y:auto;
}

.cat-item,
.payment-item,
.history-item{
  background:var(--card);
  border-radius:18px;
  padding:14px;
  margin-bottom:10px;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
}

.payment-top,
.history-top{
  display:flex;
  justify-content:space-between;
  margin-bottom:6px;
}

.status{
  color:var(--muted);
  font-size:13px;
}

button{
  cursor:pointer;
  transition:transform .12s ease;
}

button:active{
  transform:scale(.97);
}

canvas{
  width:100%;
}
</style>
</head>

<body>

<div class="app">

<section class="screen active" id="homeScreen">

<div class="header">

<div class="left-actions">
<button class="icon-btn" id="themeBtn">🌙</button>
</div>

<h1>Финансы</h1>

<div class="right-actions">
<button class="icon-btn" id="settingsBtn">⚙️</button>
</div>

</div>

<div class="card balance-card" id="balanceCard">
<div class="balance-label">Общий баланс</div>
<div class="balance-value" id="balanceValue">₽0</div>
</div>

<div class="stats">
<div class="stat">
<small>Доходы</small>
<strong id="incomeMonth">₽0</strong>
</div>

<div class="stat">
<small>Расходы</small>
<strong id="expenseMonth">₽0</strong>
</div>

<div class="stat">
<small>Активы</small>
<strong id="assetsValue">₽0</strong>
</div>
</div>

<div class="form">

<div class="segment">
<button class="type-btn active" data-type="income">💸 Доход</button>
<button class="type-btn" data-type="expense">🛒 Расход</button>
<button class="type-btn" data-type="asset">🏠 Актив</button>
</div>

<input class="input" type="number" id="amountInput" placeholder="Сумма">
<input class="input" type="text" id="commentInput" placeholder="Комментарий">

<select id="categorySelect"></select>

<button class="add-btn" id="addBtn">+</button>

</div>

<div id="transactions"></div>

</section>

<section class="screen" id="historyScreen">

<div class="header">
<h1>История баланса</h1>
</div>

<div class="card" style="margin-bottom:16px;">
<canvas id="expenseChart" width="360" height="240"></canvas>
</div>

<div id="balanceHistory"></div>

</section>

<section class="screen" id="paymentsScreen">

<div class="header">
<h1>Регулярные платежи</h1>
</div>

<div class="form">

<input class="input" type="text" id="paymentName" placeholder="Название">

<input class="input" type="number" id="paymentAmount" placeholder="Сумма">

<input class="input" type="date" id="paymentDate">

<button class="add-btn" id="addPaymentBtn">+</button>

</div>

<div id="paymentsList"></div>

</section>

<div class="bottom-nav">

<button class="nav-btn active" data-screen="homeScreen">
💰<br>Главная
</button>

<button class="nav-btn" data-screen="historyScreen">
📊<br>История
</button>

<button class="nav-btn" data-screen="paymentsScreen">
🔁<br>Платежи
</button>

</div>

</div>

<div class="modal" id="categoriesModal">
<div class="modal-content">

<h2>Категории</h2>

<div class="segment">
<button class="cat-type active" data-cat="income">💸 Доходы</button>
<button class="cat-type" data-cat="expense">🛒 Расходы</button>
<button class="cat-type" data-cat="asset">🏠 Активы</button>
</div>

<div style="display:flex; gap:10px; margin-bottom:14px;">
<input class="input" id="newCategory" placeholder="Новая категория" style="margin:0;">
<button class="icon-btn" id="addCategoryBtn">+</button>
</div>

<div id="categoriesList"></div>

</div>
</div>

<script>
const PREFIX='finance_pwa_';

const defaults={
income:[
{name:'Зарплата',emoji:'💼'},
{name:'Фриланс',emoji:'💻'},
{name:'Подарки',emoji:'🎁'},
{name:'Кэшбек',emoji:'💳'},
{name:'Другое',emoji:'✨'}
],
expense:[
{name:'Продукты',emoji:'🛒'},
{name:'Транспорт',emoji:'🚕'},
{name:'Кафе',emoji:'☕'},
{name:'Развлечения',emoji:'🎮'},
{name:'Здоровье',emoji:'💊'},
{name:'Одежда',emoji:'👕'},
{name:'Дом',emoji:'🏠'},
{name:'Другое',emoji:'✨'}
],
asset:[
{name:'Недвижимость',emoji:'🏢'},
{name:'Автомобиль',emoji:'🚗'},
{name:'Инвестиции',emoji:'📈'},
{name:'Накопления',emoji:'🏦'},
{name:'Другое',emoji:'✨'}
]
};

let operations=load('operations',[]);
let categories=load('categories',defaults);
let payments=load('payments',[]);
let theme=load('theme','light');

let currentType='income';
let currentCategoryType='income';

if(theme==='dark') document.body.classList.add('dark');

function save(key,val){
localStorage.setItem(PREFIX+key,JSON.stringify(val));
}

function load(key,fallback){
try{
return JSON.parse(localStorage.getItem(PREFIX+key)) ?? fallback;
}catch{
return fallback;
}
}

function formatMoney(v){
return '₽'+Number(v||0).toLocaleString('ru-RU');
}

function playSound(){
const ctx=new(window.AudioContext||window.webkitAudioContext)();
const osc=ctx.createOscillator();
const gain=ctx.createGain();

osc.type='sine';
osc.frequency.value=880;
gain.gain.value=.015;

osc.connect(gain);
gain.connect(ctx.destination);

osc.start();

gain.gain.exponentialRampToValueAtTime(
0.0001,
ctx.currentTime+.12
);

osc.stop(ctx.currentTime+.12);
}

function getBalance(){
return operations.reduce((a,o)=>{
if(o.type==='expense') return a-o.amount;
return a+o.amount;
},0);
}

function monthSum(type){
const now=new Date();

return operations
.filter(o=>{
const d=new Date(o.date);
return o.type===type &&
d.getMonth()===now.getMonth() &&
d.getFullYear()===now.getFullYear();
})
.reduce((s,o)=>s+o.amount,0);
}

function assets(){
return operations
.filter(o=>o.type==='asset')
.reduce((s,o)=>s+o.amount,0);
}

function updateStats(){
balanceValue.textContent=formatMoney(getBalance());
incomeMonth.textContent=formatMoney(monthSum('income'));
expenseMonth.textContent=formatMoney(monthSum('expense'));
assetsValue.textContent=formatMoney(assets());
}

function renderCategoriesSelect(){
categorySelect.innerHTML='';

categories[currentType].forEach(c=>{
const opt=document.createElement('option');
opt.value=c.name;
opt.textContent=`${c.emoji} ${c.name}`;
categorySelect.appendChild(opt);
});
}

function formatDay(date){
const d=new Date(date);
const t=new Date();

const y=new Date();
y.setDate(t.getDate()-1);

const same=(a,b)=>
a.getDate()===b.getDate() &&
a.getMonth()===b.getMonth() &&
a.getFullYear()===b.getFullYear();

if(same(d,t)) return 'Сегодня';
if(same(d,y)) return 'Вчера';

return d.toLocaleDateString('ru-RU',{
day:'numeric',
month:'long'
});
}

function renderTransactions(){

transactions.innerHTML='';

const grouped={};

[...operations]
.sort((a,b)=>new Date(b.date)-new Date(a.date))
.forEach(op=>{
const key=new Date(op.date).toDateString();
grouped[key] ??= [];
grouped[key].push(op);
});

Object.keys(grouped).forEach(key=>{

const group=document.createElement('div');
group.className='day-group';

const title=document.createElement('div');
title.className='day-title';
title.textContent=formatDay(grouped[key][0].date);

group.appendChild(title);

grouped[key].forEach(op=>{

const item=document.createElement('div');
item.className='transaction';

item.innerHTML=`
<div class="emoji">${op.emoji}</div>

<div class="info">
<div class="comment">${op.comment || op.category}</div>
<div class="time">
${new Date(op.date).toLocaleTimeString('ru-RU',{
hour:'2-digit',
minute:'2-digit'
})}
</div>
</div>

<div class="amount ${op.type}">
${op.type==='expense'?'-':'+'}
${formatMoney(op.amount).replace('₽','')}
</div>

<button class="delete-btn">🗑️</button>
`;

item.querySelector('.delete-btn').onclick=()=>{

if(confirm('Удалить операцию?')){
operations=operations.filter(x=>x.id!==op.id);
save('operations',operations);
renderAll();
}

};

item.querySelector('.info').onclick=()=>{

const amount=prompt('Новая сумма',op.amount);

if(!amount || Number(amount)<=0) return;

const comment=prompt(
'Комментарий',
op.comment || ''
);

op.amount=Number(amount);
op.comment=comment || '';

save('operations',operations);

renderAll();
};

group.appendChild(item);

});

transactions.appendChild(group);

});

}

function renderHistory(){

balanceHistory.innerHTML='';

const sorted=[...operations]
.sort((a,b)=>new Date(a.date)-new Date(b.date));

let balance=0;

const daily={};

sorted.forEach(op=>{

if(op.type==='expense') balance-=op.amount;
else balance+=op.amount;

daily[
new Date(op.date).toLocaleDateString('ru-RU')
]=balance;

});

Object.entries(daily)
.reverse()
.forEach(([date,val])=>{

const item=document.createElement('div');

item.className='history-item';

item.innerHTML=`
<div class="history-top">
<strong>${date}</strong>
<strong>${formatMoney(val)}</strong>
</div>
<div class="status">
Баланс на конец дня
</div>
`;

balanceHistory.appendChild(item);

});

}

function renderExpenseChart(){

const canvas=document.getElementById('expenseChart');
const ctx=canvas.getContext('2d');

ctx.clearRect(0,0,canvas.width,canvas.height);

const now=new Date();

const expenses=operations.filter(op=>{
const d=new Date(op.date);

return op.type==='expense' &&
d.getMonth()===now.getMonth() &&
d.getFullYear()===now.getFullYear();
});

const grouped={};

expenses.forEach(op=>{
grouped[op.category]=(grouped[op.category]||0)+op.amount;
});

const values=Object.values(grouped);
const labels=Object.keys(grouped);

if(!values.length){

ctx.font='16px sans-serif';
ctx.fillStyle='#888';
ctx.fillText('Нет расходов за месяц',40,120);

return;
}

const total=values.reduce((a,b)=>a+b,0);

const colors=[
'#ff6384',
'#36a2eb',
'#ffce56',
'#4bc0c0',
'#9966ff',
'#ff9f40',
'#8bc34a',
'#607d8b'
];

let start=0;

values.forEach((value,i)=>{

const slice=(value/total)*Math.PI*2;

ctx.beginPath();
ctx.moveTo(120,120);

ctx.arc(
120,
120,
90,
start,
start+slice
);

ctx.closePath();

ctx.fillStyle=colors[i%colors.length];

ctx.fill();

start+=slice;

});

let y=20;

labels.forEach((label,i)=>{

ctx.fillStyle=colors[i%colors.length];

ctx.fillRect(250,y,14,14);

ctx.fillStyle=getComputedStyle(document.body)
.getPropertyValue('--text');

ctx.font='13px sans-serif';

ctx.fillText(label,272,y+12);

y+=24;

});

}

function paymentStatus(date){

const today=new Date();
today.setHours(0,0,0,0);

const target=new Date(date);
target.setHours(0,0,0,0);

const diff=Math.ceil(
(target-today)/86400000
);

if(diff<0) return 'просрочено';
if(diff===0) return 'сегодня';
if(diff===1) return 'завтра';

return `через ${diff} дн.`;
}

function renderPayments(){

paymentsList.innerHTML='';

[...payments]
.sort((a,b)=>new Date(a.date)-new Date(b.date))
.forEach(p=>{

const item=document.createElement('div');

item.className='payment-item';

item.innerHTML=`
<div class="payment-top">
<strong>${p.name}</strong>
<strong>${formatMoney(p.amount)}</strong>
</div>

<div class="payment-top">
<span class="status">${p.date}</span>
<span class="status">${paymentStatus(p.date)}</span>
</div>

<button class="delete-btn">🗑️</button>
`;

item.querySelector('button').onclick=()=>{

payments=payments.filter(x=>x.id!==p.id);

save('payments',payments);

renderPayments();

};

paymentsList.appendChild(item);

});

}

function renderCategories(){

categoriesList.innerHTML='';

categories[currentCategoryType]
.forEach((cat,index)=>{

const item=document.createElement('div');

item.className='cat-item';

item.innerHTML=`
<div>${cat.emoji} ${cat.name}</div>
<button class="delete-btn">❌</button>
`;

item.querySelector('button').onclick=()=>{

if(categories[currentCategoryType].length<=1){
alert('Минимум 1 категория');
return;
}

categories[currentCategoryType].splice(index,1);

save('categories',categories);

renderCategories();
renderCategoriesSelect();

};

categoriesList.appendChild(item);

});

}

function renderAll(){

updateStats();
renderTransactions();
renderHistory();
renderExpenseChart();
renderPayments();
renderCategories();
renderCategoriesSelect();

}

document.querySelectorAll('.nav-btn').forEach(btn=>{

btn.onclick=()=>{

document.querySelectorAll('.nav-btn')
.forEach(x=>x.classList.remove('active'));

document.querySelectorAll('.screen')
.forEach(x=>x.classList.remove('active'));

btn.classList.add('active');

document
.getElementById(btn.dataset.screen)
.classList.add('active');

};

});

document.querySelectorAll('.type-btn').forEach(btn=>{

btn.onclick=()=>{

document.querySelectorAll('.type-btn')
.forEach(x=>x.classList.remove('active'));

btn.classList.add('active');

currentType=btn.dataset.type;

renderCategoriesSelect();

};

});

addBtn.onclick=()=>{

const amount=Number(amountInput.value);

if(!amount || amount<=0){
alert('Введите сумму');
return;
}

const category=categorySelect.value;

const cat=categories[currentType]
.find(x=>x.name===category);

operations.unshift({

id:Date.now(),

type:currentType,

amount,

comment:commentInput.value.trim(),

category,

emoji:cat?.emoji || '✨',

date:new Date().toISOString()

});

save('operations',operations);

amountInput.value='';
commentInput.value='';

playSound();

renderAll();

};

themeBtn.onclick=()=>{

document.body.classList.toggle('dark');

save(
'theme',
document.body.classList.contains('dark')
?'dark'
:'light'
);

themeBtn.textContent=
document.body.classList.contains('dark')
?'☀️'
:'🌙';

renderExpenseChart();

};

settingsBtn.onclick=()=>{
categoriesModal.classList.add('active');
};

document.querySelectorAll('.modal').forEach(m=>{

m.onclick=e=>{
if(e.target===m)
m.classList.remove('active');
};

});

document.querySelectorAll('.cat-type').forEach(btn=>{

btn.onclick=()=>{

document.querySelectorAll('.cat-type')
.forEach(x=>x.classList.remove('active'));

btn.classList.add('active');

currentCategoryType=btn.dataset.cat;

renderCategories();

};

});

addCategoryBtn.onclick=()=>{

const val=newCategory.value.trim();

if(!val) return;

categories[currentCategoryType].push({
name:val,
emoji:'✨'
});

save('categories',categories);

newCategory.value='';

renderCategories();
renderCategoriesSelect();

};

addPaymentBtn.onclick=()=>{

const name=paymentName.value.trim();
const amount=Number(paymentAmount.value);
const date=paymentDate.value;

if(!name || !amount || amount<=0 || !date){
alert('Заполните все поля');
return;
}

payments.push({
id:Date.now(),
name,
amount,
date
});

save('payments',payments);

paymentName.value='';
paymentAmount.value='';
paymentDate.value='';

renderPayments();

};

function createPWA(){

const canvas=document.createElement('canvas');

canvas.width=180;
canvas.height=180;

const ctx=canvas.getContext('2d');

const gradient=ctx.createLinearGradient(
0,0,180,180
);

gradient.addColorStop(0,'#777');
gradient.addColorStop(1,'#000');

ctx.fillStyle=gradient;

ctx.beginPath();
ctx.roundRect(0,0,180,180,40);
ctx.fill();

ctx.fillStyle='#fff';

ctx.font='bold 100px sans-serif';

ctx.textAlign='center';
ctx.textBaseline='middle';

ctx.fillText('₽',90,96);

const icon=canvas.toDataURL();

const manifest={
name:'Финансы',
short_name:'Финансы',
display:'standalone',
background_color:'#111',
theme_color:'#111',
start_url:'./',
icons:[{
src:icon,
sizes:'180x180',
type:'image/png'
}],
shortcuts:[
{
name:'Добавить расход',
short_name:'Расход',
url:'./?action=expense'
},
{
name:'Баланс',
short_name:'Баланс',
url:'./?action=balance'
}
]
};

const blob=new Blob(
[JSON.stringify(manifest)],
{type:'application/json'}
);

const url=URL.createObjectURL(blob);

const link=document.createElement('link');

link.rel='manifest';
link.href=url;

document.head.appendChild(link);

const apple=document.createElement('link');
apple.rel='apple-touch-icon';
apple.href=icon;

document.head.appendChild(apple);

}

function registerSW(){

if(!('serviceWorker' in navigator)) return;

const sw=`
const CACHE='finance-v1';

self.addEventListener('install',e=>{
e.waitUntil(
caches.open(CACHE).then(c=>c.addAll(['./']))
);
});

self.addEventListener('fetch',e=>{
e.respondWith(
caches.match(e.request)
.then(r=>r || fetch(e.request))
);
});
`;

const blob=new Blob(
[sw],
{type:'text/javascript'}
);

navigator.serviceWorker.register(
URL.createObjectURL(blob)
);

}

createPWA();
registerSW();
renderAll();
</script>
